const hass = {
  states,
  themes: { darkMode: true, theme: "default" },
  locale: { language: "fr", number_format: "comma_decimal", time_format: "24" },
  language: "fr",
  connected: true,
  config: { state: "RUNNING", unit_system: { temperature: "°C", length: "km", mass: "kg" } },
  localize: (key) => {
    const map = {
      "ui.card.light.brightness": "Luminosité",
      "ui.card.cover.open_cover": "Ouvrir",
      "ui.card.cover.close_cover": "Fermer",
      "ui.card.cover.stop_cover": "Arrêter",
      "ui.card.common.turn_on": "Allumer",
      "ui.card.media_player.media_play": "Lecture",
      "ui.card.media_player.media_pause": "Pause",
      "ui.card.media_player.media_stop": "Arrêter",
      "ui.card.media_player.media_next_track": "Piste suivante",
      "ui.card.media_player.media_previous_track": "Piste précédente",
      "component.media_player.entity_component._.state.playing": "En lecture",
      "component.media_player.entity_component._.state.paused": "En pause",
      "component.camera.entity_component._.state.idle": "En veille",
      "component.weather.entity_component._.state.partlycloudy": "Partiellement nuageux",
      "component.weather.entity_component._.state.rainy": "Pluie",
      "component.weather.entity_component._.state.sunny": "Ensoleillé",
      "ui.card.lock.lock": "Verrouiller",
      "ui.card.lock.unlock": "Déverrouiller",
      "ui.card.lock.open": "Ouvrir le loquet",
      "ui.card.vacuum.start": "Démarrer",
      "ui.card.vacuum.pause": "Suspendre",
      "ui.card.vacuum.return_to_base": "Retour à la base",
      "ui.card.alarm_control_panel.arm_home": "Armer en présence",
      "ui.card.alarm_control_panel.arm_away": "Armer en absence",
      "ui.card.alarm_control_panel.arm_night": "Armer la nuit",
      "ui.card.alarm_control_panel.disarm": "Désarmer",
      "component.lock.entity_component._.state.locked": "Verrouillé",
      "component.lock.entity_component._.state.unlocked": "Déverrouillé",
      "component.vacuum.entity_component._.state.docked": "À la base",
      "component.vacuum.entity_component._.state.cleaning": "Nettoyage",
      "component.alarm_control_panel.entity_component._.state.armed_away": "Armé absent",
      "component.alarm_control_panel.entity_component._.state.disarmed": "Désarmé",
      "component.climate.entity_component._.state.heat": "Chauffage",
      "component.climate.entity_component._.state.cool": "Climatisation",
      "component.climate.entity_component._.state_attributes.hvac_action.state.heating": "Chauffe",
    };
    return map[key] ?? "";
  },
  // Le vrai frontend traduit l'état avant de l'afficher ; un simulacre qui
  // renverrait l'état brut ferait passer pour correct un rendu qui montrerait
  // « armed_away » à l'utilisateur.
  // Reproduit weather/subscribe_forecast : le premier message part avant que
  // la promesse d'abonnement ne soit tenue, comme sur une vraie connexion.
  connection: {
    subscribeMessage: (cb, msg) => {
      if (msg?.type !== "weather/subscribe_forecast") return Promise.resolve(async () => {});
      window.__abos = (window.__abos ?? 0) + 1;
      const jours = [
        ["2026-08-26", "partlycloudy", 21, 12],
        ["2026-08-27", "rainy", 19, 11],
        ["2026-08-28", "cloudy", 17, 10],
        ["2026-08-29", "sunny", 24, 13],
        ["2026-08-30", "lightning-rainy", 20, 14],
        ["2026-08-31", "snowy", 4, -2],
        ["2026-09-01", "fog", 12, 8],
      ];
      const quotidien = jours.map(([d, condition, temperature, templow]) => ({
        datetime: `${d}T00:00:00+02:00`, condition, temperature, templow,
      }));
      // Sept heures à partir de maintenant, sur un soleil couché : les
      // premières tombent de nuit, les dernières après le lever.
      // Toutes en partlycloudy et espacées de trois heures : la série traverse
      // le lever du soleil, ce qui rend la bascule jour-nuit observable.
      const horaire = jours.map((_, i) => ({
        datetime: new Date(Date.now() + (i + 1) * 3 * 3600e3).toISOString(),
        condition: "partlycloudy", temperature: 13 + i,
      }));
      const forecast = msg.forecast_type === "hourly" ? horaire : quotidien;
      queueMicrotask(() => cb({ type: "event", forecast }));
      return new Promise((res) =>
        setTimeout(() => res(async () => { window.__desabos = (window.__desabos ?? 0) + 1; }), 30)
      );
    },
  },
  formatEntityState: (s) => {
    const unit = s.attributes.unit_of_measurement;
    if (unit) return `${s.state}${unit}`;
    const domain = s.entity_id.split(".")[0];
    const key = `component.${domain}.entity_component._.state.${s.state}`;
    return hass.localize(key) || s.state;
  },
  callService: (domain, service, data) => {
    console.log("callService", domain, service, data);
    // Boucle de retour simplifiée pour voir la carte réagir au clic.
    const id = data?.entity_id;
    const prev = id && states[id];
    if (!prev) return Promise.resolve();

    // Home Assistant remplace l'objet d'état à chaque changement, il ne le mute
    // jamais. Le reproduire ici est indispensable : le filtre shouldUpdate des
    // cartes compare des références, une mutation en place passerait inaperçue.
    const next = { ...prev, attributes: { ...prev.attributes } };
    if (service === "toggle") next.state = prev.state === "on" ? "off" : "on";
    if (service === "turn_off") next.state = "off";
    if (service === "turn_on") {
      next.state = "on";
      if (data.brightness_pct !== undefined) next.attributes.brightness = Math.round(data.brightness_pct * 2.55);
      // Home Assistant bascule color_mode dès qu'on lui envoie l'un ou l'autre :
      // une lampe est soit sur une température de blanc, soit sur une couleur.
      // On retire rgb_color au passage, ce qui force la carte à recalculer la
      // teinte émise depuis le réglage actif.
      if (data.color_temp_kelvin !== undefined) {
        next.attributes.color_temp_kelvin = data.color_temp_kelvin;
        next.attributes.color_mode = "color_temp";
        delete next.attributes.rgb_color;
      }
      if (data.hs_color !== undefined) {
        next.attributes.hs_color = data.hs_color;
        next.attributes.color_mode = "hs";
        delete next.attributes.rgb_color;
      }
    }
    if (service === "set_cover_position") next.attributes.current_position = data.position;
    if (service === "open_cover") { next.state = "open"; next.attributes.current_position = 100; }
    if (service === "close_cover") { next.state = "closed"; next.attributes.current_position = 0; }
    if (service === "set_temperature") next.attributes.temperature = data.temperature;
    if (service === "set_percentage") next.attributes.percentage = data.percentage;
    if (service === "volume_set") next.attributes.volume_level = data.volume_level;
    if (service === "media_play_pause") next.state = next.state === "playing" ? "paused" : "playing";
    if (service === "media_stop") next.state = "idle";
    if (service === "enable_motion_detection") next.attributes.motion_detection = true;
    if (service === "disable_motion_detection") next.attributes.motion_detection = false;
    if (service === "oscillate") next.attributes.oscillating = data.oscillating;
    if (service === "set_direction") next.attributes.direction = data.direction;
    if (service === "set_operation_mode") next.state = data.operation_mode;
    if (service === "lock") next.state = "locked";
    if (service === "unlock") next.state = "unlocked";
    if (service === "start") next.state = "cleaning";
    if (service === "pause") next.state = "paused";
    if (service === "return_to_base") next.state = "returning";
    if (service === "alarm_arm_home") next.state = "armed_home";
    if (service === "alarm_arm_away") next.state = "armed_away";
    if (service === "alarm_arm_night") next.state = "armed_night";
    if (service === "alarm_disarm") next.state = "disarmed";
    if (service === "set_hvac_mode") next.state = data.hvac_mode;
    states[id] = next;
    push();
    return Promise.resolve();
  },
};

const CARTES = [
  ["skeuo-light-card", { entity: "light.salon", subtitle: "Plafonnier · Dimmer" }],
  ["skeuo-climate-card", { entity: "climate.chambre", subtitle: "Thermostat" }],
  ["skeuo-cover-card", { entity: "cover.salon", subtitle: "Store motorisé" }],
  ["skeuo-sensor-card", { entity: "sensor.humidite", subtitle: "Capteur" }],
  ["skeuo-switch-card", { entity: "switch.prise", subtitle: "Prise pilotée", power_entity: "sensor.prise_puissance", energy_entity: "sensor.prise_energie" }],
  ["skeuo-lock-card", { entity: "lock.entree", subtitle: "Verrouillage connecté" }],
  ["skeuo-fan-card", { entity: "fan.bureau", subtitle: "Circulation d'air" }],
  ["skeuo-water-heater-card", { entity: "water_heater.ballon", subtitle: "Ballon thermodynamique" }],
  ["skeuo-vacuum-card", { entity: "vacuum.robot", subtitle: "Robot nettoyeur" }],
  ["skeuo-alarm-card", { entity: "alarm_control_panel.maison", subtitle: "Système de sécurité" }],
  ["skeuo-weather-card", { entity: "weather.exterieur", subtitle: "Prévisions locales" }],
  ["skeuo-forecast-card", { entity: "weather.exterieur", subtitle: "Prévisions 5 jours" }],
  ["skeuo-media-card", { entity: "media_player.salon", subtitle: "MPD · Bluetooth" }],
  ["skeuo-camera-card", { entity: "camera.entree", subtitle: "Vidéosurveillance" }],
];

const mounted = [];
for (const [type, config] of CARTES) {
  const cell = document.createElement("div");
  cell.className = "cell";
  const el = document.createElement(type);
  el.setConfig({ type: `custom:${type}`, ...config });
  cell.appendChild(el);
  document.getElementById("g").appendChild(cell);
  mounted.push(el);
}
const next = { ...hass, states: { ...states } };
for (const el of mounted) el.hass = next;
window.__cards = mounted;
</script>
